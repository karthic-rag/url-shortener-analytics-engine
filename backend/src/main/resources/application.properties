# ===================================================================
# 1. SERVER CONFIGURATION
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# 2. MYSQL DATABASE CONNECTION
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/url_shortener_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootadmin7}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 3. JPA / HIBERNATE ORM PERFORMANCE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# 4. REDIS CACHING CONFIGURATION
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=2000

# ===================================================================
# 5. CORS (CROSS-ORIGIN RESOURCE SHARING) CONTROL
# ===================================================================
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===================================================================
# 6. PLATFORM CONFIGURATION
# ===================================================================
base.url=${BASE_URL:http://localhost:8080/}
